<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto-Pokedex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="pokedex">
            <div class="pokedex-header">
                <div class="logo">
                    <img src="img/logo.png" alt="Pokémon">
                </div>
            </div>
            <div class="row parte-superior">
                <div class="col-md-6 informacoes">
                    <h1 id="nome"></h1>
                        <p>Tipo: <b id="tipo"></b></p>
                        <p>Habilidade: <b id="habilidade"></b></p>
                        <p>Altura: <b id="altura"></b> dm</p>
                        <p>Peso: <b id="peso"></b> hg</p>
                </div>
                <div class="col-md-6 status">
                    <div class="status-item">
                        <span class="status-nome">HP</span>
                        <div class="barra">
                            <div id="hp-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="hp" class="status-valor"></span>
                    </div>

                    <div class="status-item">
                        <span class="status-nome">Ataque</span>
                        <div class="barra">
                            <div id="ataque-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="ataque" class="status-valor"></span>
                    </div>

                    <div class="status-item">
                        <span class="status-nome">Defesa</span>
                        <div class="barra">
                            <div id="defesa-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="defesa" class="status-valor"></span>
                    </div>

                    <div class="status-item">
                        <span class="status-nome">Ataque Especial</span>
                        <div class="barra">
                            <div id="ataque-especial-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="ataque-especial" class="status-valor"></span>
                    </div>

                    <div class="status-item">
                        <span class="status-nome">Defesa Especial</span>
                        <div class="barra">
                            <div id="defesa-especial-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="defesa-especial" class="status-valor"></span>
                    </div>

                    <div class="status-item">
                        <span class="status-nome">Velocidade</span>
                        <div class="barra">
                            <div id="velocidade-barra" class="barra-preenchida"></div>
                        </div>
                        <span id="velocidade" class="status-valor"></span>
                    </div>
                </div>
            </div>
            <div class="row parte-inferior">
                <div class="col-md-6 imagem-area">
                    <div class="pokemon-id">
                        <h2 id="ID">#000</h2>
                    </div>
                    <img id="poke-img"src=""alt="Imagem do Pokemon">
                </div>
                <div class="col-md-6 quick-search">
                    <h2>Pesquisa Rápida:</h2>
                    <label class="form-label">Nome ou ID do Pokemon:</label>
                    <div class="search-area">
                        <input id="pokemon" type="text" class="form-control">
                        <button id="poke-button" type="button" class="btn mt-3">Buscar</button>
                    </div>
                </div>
            </div>
            <footer>© 2026 Projeto Pokedex - Todos os direitos reservados.</footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
